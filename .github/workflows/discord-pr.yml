name: Discord PR notification

on:
  pull_request_target:
    types: [opened]
    branches: [dev]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Read event data only. Never check out or execute code from the PR.
      - name: Announce the new pull request
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook:
              raise SystemExit("Missing repository secret: DISCORD_WEBHOOK_URL")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          pr = event["pull_request"]
          repo = os.environ["GITHUB_REPOSITORY"]
          title = re.sub(r"([\\`*_~|\[\]])", r"\\\1", pr["title"])
          author = pr["user"]["login"]
          number = pr["number"]
          url = f"https://github.com/{repo}/pull/{number}"
          draft = " (Draft)" if pr.get("draft") else ""
          payload = {
              "content": (
                  f"🔔 **{author}** opened **#{number} — {title}**{draft}\n"
                  f"Repository: **{repo.split('/')[-1]}**\n"
                  f"🔗 {url}"
              ),
              "allowed_mentions": {"parse": []},
          }
          request = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-PR-Notifications"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  response.read()
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Discord rejected notification: HTTP {error.code}") from None
          except urllib.error.URLError:
              raise SystemExit("Could not connect to Discord") from None
          print("PR notification sent to Discord.")
          PY
