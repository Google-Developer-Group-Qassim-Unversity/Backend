name: Deploy

# A push to dev deploys staging (api-dev.gdg-q.com, docs/STAGING.md); a push to
# main, which only ever receives dev, deploys production. Run it by hand on
# either branch to redeploy.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A deploy replaces its directory on the VPS; queue merges instead of overlapping them.
concurrency:
  group: deploy
  cancel-in-progress: false

# Everything that differs between the two deployments. Nothing below may name
# prod or staging directly. Staging runs one worker: it serves a handful of
# developers, and the VPS also carries prod.
env:
  BRANCH: ${{ github.ref_name }}
  INFISICAL_ENV: ${{ github.ref_name == 'dev' && 'staging' || 'prod' }}
  BACKEND_NAME: ${{ github.ref_name == 'dev' && 'GDG-backend-staging' || 'GDG-backend' }}
  BACKEND_PORT: ${{ github.ref_name == 'dev' && '7502' || '7501' }}
  BACKEND_WORKERS: ${{ github.ref_name == 'dev' && '1' || '4' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BRANCH,INFISICAL_ENV,BACKEND_NAME,BACKEND_PORT,BACKEND_WORKERS
          script: |
            set -e
            export PATH="$HOME/.local/bin:/home/ubuntu/.nvm/versions/node/v24.12.0/bin:$PATH"
            NAME=$BACKEND_NAME
            DIR=~/$NAME
            SECRETS="infisical run --env=$INFISICAL_ENV --path=/admin-backend --projectId=300b1e97-7e52-4a4e-872d-053b9082cac5 --silent --"

            source /etc/infisical/prod.env
            INFISICAL_TOKEN=$(infisical login --method="$INFISICAL_AUTH_METHOD" \
              --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
              --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" --plain --silent)
            export INFISICAL_TOKEN

            # 1. Build the release next to the live one. Until step 3 the running
            #    app is untouched, so any failure here leaves it serving.
            rm -rf "$DIR.new"
            git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository }}.git "$DIR.new"
            rm -rf "$DIR.new/.git"
            cd "$DIR.new"
            uv sync --locked

            # 2. Migrate this deployment's database to the release's head, then confirm it got there.
            echo "$INFISICAL_ENV is at: $($SECRETS uv run alembic current 2>/dev/null)"
            $SECRETS uv run alembic upgrade head
            $SECRETS uv run alembic current --check-heads

            # 3. Replace the live release and restart. The venv is rebuilt because
            #    its scripts hardcode the directory path.
            rm -rf "$DIR"
            mv "$DIR.new" "$DIR"
            cd "$DIR"
            rm -rf .venv
            uv sync --locked
            pm2 delete $NAME || true
            pm2 start "INFISICAL_TOKEN=$INFISICAL_TOKEN $SECRETS uv run uvicorn app.main:app --port $BACKEND_PORT --host 0.0.0.0 --workers $BACKEND_WORKERS" --name $NAME --time
            pm2 save

            # 4. Smoke test: the app is up, reaches the DB, and a real ORM query works.
            for i in $(seq 30); do
              if curl -fsS -o /dev/null localhost:$BACKEND_PORT/health/db && curl -fsS -o /dev/null localhost:$BACKEND_PORT/events/; then
                echo "Backend is serving ✅"; exit 0
              fi
              sleep 2
            done
            echo "Backend failed its smoke test ❌"
            pm2 logs $NAME --lines 60 --nostream
            exit 1
